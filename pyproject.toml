[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-multi-agent-coordination-layer"
version = "0.1.0"
description = "PostgreSQL persistence for the Hermes Multi-Agent Coordination Layer"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-randomly>=3.16,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hermes_coordination.storage" = ["migrations/alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
